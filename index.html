<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dave Kelley — Songs</title>

<style>
:root {
  --accent: #f4e3c1;
  --text: #ffffff;
  --bg-dim: rgba(0,0,0,0.22);
  --bg-dim-lyrics: rgba(0,0,0,0.62);
}

html, body {
  height: 100%;
  margin: 0;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, system-ui, "Helvetica Neue", Arial, sans-serif;
  color: var(--text);
  background:
    linear-gradient(var(--bg-dim), var(--bg-dim)),
    url('./assets/bg.jpg') center / cover no-repeat fixed;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding-top: 36px;
  box-sizing: border-box;
  transition: background 1.1s cubic-bezier(0.4, 0.0, 0.2, 1);
}

body.lyrics-open {
  background:
    linear-gradient(var(--bg-dim-lyrics), var(--bg-dim-lyrics)),
    url('./assets/bg.jpg') center / cover no-repeat fixed;
}

/* Song picker */
.song-picker {
  z-index: 10;
  width: min(92vw, 600px);
  text-align: center;
  margin-top: 8vh;
}

.song-picker h1 {
  font-size: 26px;
  margin: 0 0 8px;
  font-weight: 600;
}

.song-picker-subtitle {
  color: var(--accent);
  opacity: 0.92;
  margin-bottom: 28px;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 17px;
}

.song-options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}

.song-card {
  min-height: 165px;
  padding: 20px;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.20);
  background: rgba(0,0,0,0.38);
  backdrop-filter: blur(6px);
  color: var(--text);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  transition:
    transform 0.25s ease,
    background 0.25s ease,
    border-color 0.25s ease;
}

.song-card:hover {
  transform: translateY(-3px);
  background: rgba(0,0,0,0.52);
  border-color: rgba(244,227,193,0.55);
}

.song-card-title {
  font-family: Georgia, "Times New Roman", serif;
  font-size: 22px;
  color: var(--accent);
  margin-bottom: 8px;
}

.song-card-subtitle {
  font-size: 13px;
  opacity: 0.82;
  line-height: 1.35;
}

.song-card-credit {
  margin-top: 11px;
  padding-top: 10px;
  width: 86%;
  border-top: 1px solid rgba(255,255,255,0.12);
  font-size: 12px;
  line-height: 1.45;
  opacity: 0.72;
}

/* Player card */
.card {
  z-index: 10;
  backdrop-filter: blur(4px);
  background: rgba(0,0,0,0.30);
  border: 1px solid rgba(255,255,255,0.14);
  border-radius: 14px;
  padding: 14px 18px;
  width: min(92vw, 460px);
  text-align: center;
  box-shadow: 0 12px 40px rgba(0,0,0,0.4);
  display: none;
}

.card h1 {
  margin: 0 0 6px;
  font-size: 19px;
  font-weight: 600;
}

.song-credit {
  font-size: 12px;
  line-height: 1.4;
  opacity: 0.76;
  margin: 2px 0 8px;
}

.dedication {
  font-size: 14px;
  color: var(--accent);
  opacity: 0.9;
  margin-bottom: 8px;
}

.top-controls {
  display: flex;
  justify-content: flex-start;
  align-items: center;
  margin-bottom: 10px;
}

.back-btn,
.lyrics-toggle {
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.25);
  padding: 6px 12px;
  color: var(--accent);
  font-size: 13px;
  border-radius: 8px;
  cursor: pointer;
}

.lyrics-toggle {
  margin-top: 8px;
}

/* Lyrics */
.lyrics-container {
  margin-top: 12px;
  max-height: 45vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  display: none;
  opacity: 0;
  transform: translateY(-8px);
  transition:
    opacity 0.9s cubic-bezier(0.4, 0.0, 0.2, 1),
    transform 0.9s cubic-bezier(0.4, 0.0, 0.2, 1);
}

.lyrics-container.open {
  display: block;
  opacity: 1;
  transform: translateY(0);
}

.lyrics-line {
  padding: 6px 0;
  font-size: 14px;
  line-height: 1.4;
  opacity: 0.45;
  transition:
    opacity 0.4s ease,
    transform 0.4s ease,
    text-shadow 0.4s ease,
    color 0.4s ease;
}

.lyrics-line.active {
  opacity: 1;
  color: var(--accent);
  text-shadow:
    0 0 6px rgba(244,227,193,0.35),
    0 0 14px rgba(244,227,193,0.15);
}

/* Untimed lyrics should be fully readable */
.lyrics-container.untimed .lyrics-line {
  opacity: 0.92;
}

/* Play bar */
.playbar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 20;
  padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
  backdrop-filter: blur(10px);
  background: rgba(0,0,0,0.35);
  border-top: 1px solid rgba(255,255,255,0.12);
  display: none;
  align-items: center;
  gap: 10px;
}

.play-btn {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.35);
  background: rgba(0,0,0,0.85);
  color: #f5f5f5;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.song-title {
  flex: 1;
  font-size: 14px;
  opacity: 0.9;
}

.time {
  font-size: 12px;
  opacity: 0.7;
  min-width: 38px;
  text-align: right;
}

.progress-wrap {
  flex: 2;
  position: relative;
  height: 28px;
  display: flex;
  align-items: center;
}

.progress {
  width: 100%;
  height: 4px;
  background: rgba(255,255,255,0.25);
  border-radius: 2px;
  position: relative;
  touch-action: none;
}

.progress-fill {
  height: 100%;
  background: var(--accent);
  width: 0%;
  border-radius: 2px;
}

.thumb {
  position: absolute;
  left: 0;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 14px;
  height: 14px;
  background: var(--accent);
  border-radius: 50%;
  box-shadow: 0 0 6px rgba(0,0,0,0.4);
  pointer-events: none;
}

@media (max-width: 600px) {
  .song-options {
    grid-template-columns: 1fr;
  }

  .song-picker {
    margin-top: 3vh;
  }

  .song-card {
    min-height: 135px;
  }

  .song-title {
    display: none;
  }
}
</style>
</head>

<body>

<div id="songPicker" class="song-picker">
  <h1>Dave Kelley</h1>
  <div class="song-picker-subtitle">Two Songs, One Story</div>

  <div class="song-options">
    <button class="song-card" onclick="loadSong('sara')">
      <div class="song-card-title">Sara</div>
      <div class="song-card-subtitle">For Sara — Ten Years, Every Note for You.</div>
      <div class="song-card-credit">
        Written, composed &amp; performed by Dave Kelley
      </div>
    </button>

    <button class="song-card" onclick="loadSong('whentimestoodstill')">
      <div class="song-card-title">When Time Stood Still</div>
      <div class="song-card-subtitle">The day life changed as she knew it.</div>
      <div class="song-card-credit">
        Written &amp; composed by Dave Kelley<br>
        Performed by Perry Barton
      </div>
    </button>
  </div>
</div>

<main id="songPage" class="card">
  <div class="top-controls">
    <button class="back-btn" onclick="showSongPicker()">← Songs</button>
  </div>

  <h1 id="pageTitle"></h1>
  <div id="pageCredit" class="song-credit"></div>
  <div id="dedication" class="dedication"></div>

  <button id="lyricsToggle" class="lyrics-toggle" onclick="toggleLyrics()">
    Show Lyrics
  </button>

  <div id="lyrics" class="lyrics-container"></div>
</main>

<div id="playbar" class="playbar">
  <button id="playBtn" class="play-btn">▶</button>
  <div id="playerTitle" class="song-title"></div>
  <div id="currentTime" class="time">0:00</div>

  <div id="progressWrap" class="progress-wrap">
    <div id="progress" class="progress">
      <div id="progressFill" class="progress-fill"></div>
    </div>
    <div id="thumb" class="thumb"></div>
  </div>

  <div id="duration" class="time">0:00</div>
</div>

<audio id="audio"></audio>

<script>
const songs = {
  sara: {
    title: "Sara",
    performer: "Dave Kelley",
    credit: "Written, composed & performed by Dave Kelley",
    audio: "Sara.mp3",
    dedication: "For Sara — Ten Years, Every Note for You.",
    lyricOffset: 12.5,
    timedLyrics: true,
    lyrics: [
      [0,"God placed, us side by side that day"],
      [6,"The same team at work where hearts found their way"],
      [13,"Friendship sparked a love soon grew"],
      [18,"God’s quiet plan was leading to you"],
      [25,"Sara my heart still stands in awe"],
      [31,"God’s grace has carried us through it all"],
      [37,"Your smile, your eyes, they calm me too"],
      [44,"God knew my best, would start with you"],
      [56,"Love Bryce and Gavin with all your heart"],
      [63,"Through faith and care our family’s grown"],
      [69,"So strong, so wise, so steady and true"],
      [75,"God’s love shines brightly through you"],
      [82,"Sara my heart still stands in awe"],
      [88,"God’s grace has carried us through it all"],
      [94,"Your smile, your eyes, they calm me too"],
      [100,"God knew my best, would start with you"],
      [113,"From Mexico waves to the oceans hue"],
      [119,"Diamondback games and laughter too"],
      [125,"Working from home, still side by side"],
      [131,"Together all these years, our hearts abide"],
      [142,"Sara my best friend, my gift, my truth"],
      [149,"The best human I ever knew"],
      [155,"Everyday I thank god anew"],
      [161,"For this life, he wrote, with you"]
    ]
  },

  whentimestoodstill: {
    title: "When Time Stood Still",
    performer: "Perry Barton",
    credit: "Written & composed by Dave Kelley • Performed by Perry Barton",
    audio: "whentimestoodstill.mp3",
    dedication: "The day life changed as she knew it.",
    lyricOffset: 0,
    timedLyrics: false,
    lyrics: [
      [0,"We spent the whole day chasing red rock and daylight"],
      [0,"Sedona sun on your face, everything felt right"],
      [0,"Wandering the shops, goofing off like we still do"],
      [0,"Didn't want that Saturday to end, just me and you"],
      [0,"We drove home slow with the window down"],
      [0,"Talking 'bout forever, talking 'bout now"],
      [0,"You were praying for the life we’d find"],
      [0,"Wondering if two faiths could share one bind"],

      [0,"Pulled off the highway, one more stop to go"],
      [0,"Tank running low, hearts running slow"],
      [0,"I was just a guy at the pump, unaware"],
      [0,"Heaven picked that moment to answer your prayer"],

      [0,"When time stood still"],
      [0,"Out by the road"],
      [0,"When time stood still"],
      [0,"And the whole world slowed"],
      [0,"You said yes, then you knew"],
      [0,"Love was making room"],
      [0,"When time stood still"],
      [0,"Right there with you"],

      [0,"After that trip, we kept on waiting"],
      [0,"For wedding rings and a door worth opening"],
      [0,"No moving in until the vows were done"],
      [0,"Two lives, one flame, and a race now run"],
      [0,"You hoped for a baby, a cradle, a name"],
      [0,"Life came another way, but it still changed"],
      [0,"You found those boys and loved them like home"],
      [0,"Step by step, they were never alone"],

      [0,"And I saw it plain in the way you smiled"],
      [0,"Like something broken had been reconciled"],
      [0,"You were asking God for a place to belong"],
      [0,"Then love answered back super strong"],

      [0,"When time stood still"],
      [0,"Out by the road"],
      [0,"When time stood still"],
      [0,"And the whole world slowed"],
      [0,"You said yes, then you knew"],
      [0,"Love was making room"],
      [0,"When time stood still"],
      [0,"Right there with you"],

      [0,"You tried to hide it, turned your face away"],
      [0,"But I could tell, so I asked you anyway"],
      [0,"You said the Spirit gave you your answer"],
      [0,"Right there outside of town"],
      [0,"And in that quiet little second"],
      [0,"The tears came down"],
      [0,"When time stood still"],
      [0,"And the road felt holy"],
      [0,"When time stood still"],
      [0,"You were never lonely"],
      [0,"From that gas pump prayer"],
      [0,"To the life we share"],
      [0,"When time stood still"],
      [0,"Right there with you"]
    ]
  }
};

const audio = document.getElementById("audio");
const songPicker = document.getElementById("songPicker");
const songPage = document.getElementById("songPage");
const playbar = document.getElementById("playbar");
const pageTitle = document.getElementById("pageTitle");
const pageCredit = document.getElementById("pageCredit");
const playerTitle = document.getElementById("playerTitle");
const dedication = document.getElementById("dedication");
const lyricsToggle = document.getElementById("lyricsToggle");
const lyricsBox = document.getElementById("lyrics");
const playBtn = document.getElementById("playBtn");
const progress = document.getElementById("progress");
const progressFill = document.getElementById("progressFill");
const thumb = document.getElementById("thumb");
const progressWrap = document.getElementById("progressWrap");
const currentTimeEl = document.getElementById("currentTime");
const durationEl = document.getElementById("duration");

let currentSong = null;
let isScrubbing = false;

function loadSong(songKey) {
  currentSong = songs[songKey];

  audio.pause();
  audio.currentTime = 0;
  playBtn.textContent = "▶";

  audio.src = currentSong.audio;
  audio.load();

  pageTitle.textContent = `“${currentSong.title}”`;
  pageCredit.textContent = currentSong.credit;
  playerTitle.textContent = `${currentSong.title} — ${currentSong.performer}`;
  dedication.textContent = currentSong.dedication;

  lyricsBox.innerHTML = "";
  lyricsBox.classList.toggle("untimed", !currentSong.timedLyrics);

  currentSong.lyrics.forEach(([_, text]) => {
    const d = document.createElement("div");
    d.className = "lyrics-line";
    d.textContent = text;
    lyricsBox.appendChild(d);
  });

  lyricsToggle.style.display =
    currentSong.lyrics.length > 0 ? "inline-block" : "none";

  lyricsToggle.textContent = "Show Lyrics";
  lyricsBox.classList.remove("open");
  document.body.classList.remove("lyrics-open");

  progressFill.style.width = "0%";
  thumb.style.left = "0%";
  currentTimeEl.textContent = "0:00";
  durationEl.textContent = "0:00";

  songPicker.style.display = "none";
  songPage.style.display = "block";
  playbar.style.display = "flex";
}

function showSongPicker() {
  audio.pause();
  audio.currentTime = 0;
  playBtn.textContent = "▶";

  songPage.style.display = "none";
  playbar.style.display = "none";

  lyricsBox.classList.remove("open");
  document.body.classList.remove("lyrics-open");
  lyricsToggle.textContent = "Show Lyrics";

  songPicker.style.display = "block";
}

audio.onloadedmetadata = () => {
  durationEl.textContent = formatTime(audio.duration);
};

audio.onerror = () => {
  playBtn.textContent = "▶";
  durationEl.textContent = "—";
  console.error("Audio failed to load:", currentSong?.audio, audio.error);
};

audio.onended = () => {
  playBtn.textContent = "▶";
};

playBtn.onclick = () => {
  if (audio.paused) {
    audio.play()
      .then(() => {
        playBtn.textContent = "❚❚";
      })
      .catch(err => {
        playBtn.textContent = "▶";
        console.error("Audio playback failed:", err);
      });
  } else {
    audio.pause();
    playBtn.textContent = "▶";
  }
};

progressWrap.addEventListener("pointerdown", e => {
  isScrubbing = true;
  progressWrap.setPointerCapture(e.pointerId);
  scrub(e);
});

progressWrap.addEventListener("pointermove", e => {
  if (!isScrubbing) return;
  scrub(e);
});

progressWrap.addEventListener("pointerup", e => {
  isScrubbing = false;
  progressWrap.releasePointerCapture(e.pointerId);
});

function scrub(e) {
  if (!audio.duration) return;

  const rect = progress.getBoundingClientRect();
  const pct = Math.min(
    Math.max((e.clientX - rect.left) / rect.width, 0),
    1
  );

  audio.currentTime = pct * audio.duration;
}

audio.ontimeupdate = () => {
  if (!currentSong) return;

  currentTimeEl.textContent = formatTime(audio.currentTime);

  if (audio.duration) {
    const pct = audio.currentTime / audio.duration;
    progressFill.style.width = pct * 100 + "%";
    thumb.style.left = pct * 100 + "%";
  }

  if (!currentSong.lyrics.length || !currentSong.timedLyrics) {
    return;
  }

  const t = Math.max(
    0,
    audio.currentTime - currentSong.lyricOffset
  );

  const lines = document.querySelectorAll(".lyrics-line");

  for (let i = 0; i < currentSong.lyrics.length; i++) {
    const next = currentSong.lyrics[i + 1]?.[0] ?? Infinity;

    if (
      t >= currentSong.lyrics[i][0] &&
      t < next
    ) {
      lines.forEach(l => l.classList.remove("active"));
      lines[i].classList.add("active");

      if (lyricsBox.classList.contains("open")) {
        lines[i].scrollIntoView({
          block: "center",
          behavior: "smooth"
        });
      }

      break;
    }
  }
};

function toggleLyrics() {
  lyricsBox.classList.toggle("open");
  document.body.classList.toggle("lyrics-open");

  lyricsToggle.textContent =
    lyricsBox.classList.contains("open")
      ? "Hide Lyrics"
      : "Show Lyrics";
}

function formatTime(sec) {
  if (!Number.isFinite(sec)) return "0:00";

  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60)
    .toString()
    .padStart(2, "0");

  return `${m}:${s}`;
}
</script>

</body>
</html>
