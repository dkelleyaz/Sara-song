<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dave Kelley — Songs</title>

<style>
:root {
  --accent: #f4e3c1;
  --text: #ffffff;
  --text-soft: rgba(255,255,255,0.72);
  --text-faint: rgba(255,255,255,0.52);
  --panel: rgba(18,18,18,0.34);
  --panel-strong: rgba(18,18,18,0.48);
  --border: rgba(255,255,255,0.14);
  --bg-dim: rgba(0,0,0,0.22);
  --bg-dim-lyrics: rgba(0,0,0,0.62);
}

html, body {
  height: 100%;
  margin: 0;
}

body {
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Text",
    "SF Pro Display",
    "Segoe UI",
    Roboto,
    "Helvetica Neue",
    Arial,
    sans-serif;
  color: var(--text);
  background:
    linear-gradient(var(--bg-dim), var(--bg-dim)),
    url('./assets/bg.jpg') center / cover no-repeat fixed;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding-top: 36px;
  box-sizing: border-box;
  transition: background 1.1s cubic-bezier(0.4, 0.0, 0.2, 1);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

body.lyrics-open {
  background:
    linear-gradient(var(--bg-dim-lyrics), var(--bg-dim-lyrics)),
    url('./assets/bg.jpg') center / cover no-repeat fixed;
}

button {
  font: inherit;
  -webkit-appearance: none;
  appearance: none;
}

/* -------------------------
   SONG PICKER
-------------------------- */

.song-picker {
  z-index: 10;
  width: min(92vw, 620px);
  text-align: center;
  margin-top: 8vh;
}

.site-name {
  margin-bottom: 8px;
  color: var(--text-soft);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.song-picker h1 {
  margin: 0 0 30px;
  font-size: clamp(25px, 5vw, 31px);
  line-height: 1.12;
  font-weight: 600;
  letter-spacing: -0.025em;
}

.song-options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.song-card {
  min-height: 170px;
  padding: 22px 20px;
  border-radius: 18px;
  border: 1px solid var(--border);
  background: var(--panel);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  color: var(--text);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  box-shadow: 0 12px 36px rgba(0,0,0,0.22);
  transition:
    transform 0.22s ease,
    background 0.22s ease,
    border-color 0.22s ease,
    box-shadow 0.22s ease;
}

.song-card:hover {
  transform: translateY(-2px);
  background: var(--panel-strong);
  border-color: rgba(255,255,255,0.24);
  box-shadow: 0 15px 42px rgba(0,0,0,0.30);
}

.song-card:active {
  transform: translateY(0);
}

.song-card-title {
  margin-bottom: 8px;
  font-size: 21px;
  line-height: 1.18;
  font-weight: 600;
  letter-spacing: -0.018em;
}

.song-card-subtitle {
  max-width: 250px;
  font-size: 13px;
  line-height: 1.45;
  font-weight: 400;
  color: var(--text-soft);
}

.song-card-credit {
  margin-top: 13px;
  padding-top: 11px;
  width: 88%;
  border-top: 1px solid rgba(255,255,255,0.10);
  font-size: 11.5px;
  line-height: 1.45;
  font-weight: 400;
  color: var(--text-faint);
}

/* -------------------------
   PLAYER CARD
-------------------------- */

.card {
  z-index: 10;
  width: min(92vw, 480px);
  padding: 16px 20px 18px;
  box-sizing: border-box;
  text-align: center;
  border: 1px solid var(--border);
  border-radius: 18px;
  background: var(--panel);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 14px 44px rgba(0,0,0,0.32);
  display: none;
}

.card h1 {
  margin: 2px 0 6px;
  font-size: 22px;
  line-height: 1.18;
  font-weight: 600;
  letter-spacing: -0.022em;
}

.song-credit {
  margin: 0 0 7px;
  font-size: 12px;
  line-height: 1.45;
  font-weight: 400;
  color: var(--text-soft);
}

.dedication {
  margin: 0 0 9px;
  font-size: 13px;
  line-height: 1.4;
  font-weight: 400;
  color: var(--accent);
  opacity: 0.92;
}

.top-controls {
  display: flex;
  justify-content: flex-start;
  align-items: center;
  margin-bottom: 11px;
}

.back-btn,
.lyrics-toggle {
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 9px;
  background: rgba(255,255,255,0.10);
  color: rgba(255,255,255,0.88);
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: -0.005em;
  transition:
    background 0.2s ease,
    border-color 0.2s ease;
}

.back-btn {
  padding: 6px 10px;
}

.lyrics-toggle {
  margin-top: 8px;
  padding: 7px 12px;
}

.back-btn:hover,
.lyrics-toggle:hover {
  background: rgba(255,255,255,0.16);
  border-color: rgba(255,255,255,0.26);
}

/* -------------------------
   LYRICS
-------------------------- */

.lyrics-container {
  margin-top: 13px;
  max-height: 45vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  display: none;
  opacity: 0;
  transform: translateY(-6px);
  transition:
    opacity 0.55s cubic-bezier(0.4, 0.0, 0.2, 1),
    transform 0.55s cubic-bezier(0.4, 0.0, 0.2, 1);
}

.lyrics-container.open {
  display: block;
  opacity: 1;
  transform: translateY(0);
}

.lyrics-line {
  padding: 6px 0;
  font-size: 14px;
  line-height: 1.5;
  font-weight: 400;
  letter-spacing: -0.004em;
  opacity: 0.40;
  transition:
    opacity 0.35s ease,
    transform 0.35s ease,
    text-shadow 0.35s ease,
    color 0.35s ease;
}

.lyrics-line.active {
  opacity: 1;
  color: var(--accent);
  text-shadow:
    0 0 6px rgba(244,227,193,0.30),
    0 0 14px rgba(244,227,193,0.12);
}

/* Until every timestamp is entered, untimed lyrics stay fully readable. */
.lyrics-container.untimed .lyrics-line {
  opacity: 0.92;
}

/* -------------------------
   PLAY BAR
-------------------------- */

.playbar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 20;
  padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
  background: rgba(14,14,14,0.46);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid rgba(255,255,255,0.10);
  display: none;
  align-items: center;
  gap: 10px;
}

.play-btn {
  width: 34px;
  height: 34px;
  flex: 0 0 34px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.24);
  background: rgba(0,0,0,0.72);
  color: #ffffff;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.song-title {
  flex: 1;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: -0.006em;
  color: rgba(255,255,255,0.86);
}

.time {
  min-width: 38px;
  text-align: right;
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  color: rgba(255,255,255,0.62);
}

.progress-wrap {
  flex: 2;
  position: relative;
  height: 28px;
  display: flex;
  align-items: center;
}

.progress {
  width: 100%;
  height: 4px;
  position: relative;
  border-radius: 999px;
  background: rgba(255,255,255,0.22);
  touch-action: none;
}

.progress-fill {
  width: 0%;
  height: 100%;
  border-radius: 999px;
  background: var(--accent);
}

.thumb {
  position: absolute;
  left: 0;
  top: 50%;
  width: 14px;
  height: 14px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 1px 7px rgba(0,0,0,0.42);
  pointer-events: none;
}

/* -------------------------
   MOBILE
-------------------------- */

@media (max-width: 600px) {
  body {
    padding-top: 24px;
  }

  .song-picker {
    margin-top: 3vh;
  }

  .song-picker h1 {
    margin-bottom: 22px;
  }

  .song-options {
    grid-template-columns: 1fr;
    gap: 12px;
  }

  .song-card {
    min-height: 138px;
  }

  .song-title {
    display: none;
  }

  .card {
    padding-left: 16px;
    padding-right: 16px;
  }
}
</style>
</head>

<body>

<div id="songPicker" class="song-picker">
  <div class="site-name">Dave Kelley</div>
  <h1>Two Songs, One Story</h1>

  <div class="song-options">
    <button class="song-card" onclick="loadSong('sara')">
      <div class="song-card-title">Sara</div>
      <div class="song-card-subtitle">For Sara — Ten Years, Every Note for You.</div>
      <div class="song-card-credit">
        Written, composed &amp; performed by Dave Kelley
      </div>
    </button>

    <button class="song-card" onclick="loadSong('whentimestoodstill')">
      <div class="song-card-title">When Time Stood Still</div>
      <div class="song-card-subtitle">The day life changed as she knew it.</div>
      <div class="song-card-credit">
        Written &amp; composed by Dave Kelley<br>
        Performed by Perry Barton
      </div>
    </button>
  </div>
</div>

<main id="songPage" class="card">
  <div class="top-controls">
    <button class="back-btn" onclick="showSongPicker()">← Songs</button>
  </div>

  <h1 id="pageTitle"></h1>
  <div id="pageCredit" class="song-credit"></div>
  <div id="dedication" class="dedication"></div>

  <button id="lyricsToggle" class="lyrics-toggle" onclick="toggleLyrics()">
    Show Lyrics
  </button>

  <div id="lyrics" class="lyrics-container"></div>
</main>

<div id="playbar" class="playbar">
  <button id="playBtn" class="play-btn">▶</button>
  <div id="playerTitle" class="song-title"></div>
  <div id="currentTime" class="time">0:00</div>

  <div id="progressWrap" class="progress-wrap">
    <div id="progress" class="progress">
      <div id="progressFill" class="progress-fill"></div>
    </div>
    <div id="thumb" class="thumb"></div>
  </div>

  <div id="duration" class="time">0:00</div>
</div>

<audio id="audio"></audio>

<script>
const songs = {
  sara: {
    title: "Sara",
    performer: "Dave Kelley",
    credit: "Written, composed & performed by Dave Kelley",
    audio: "Sara.mp3",
    dedication: "For Sara — Ten Years, Every Note for You.",
    lyricOffset: 12.5,
    lyrics: [
      [0,"God placed, us side by side that day"],
      [6,"The same team at work where hearts found their way"],
      [13,"Friendship sparked a love soon grew"],
      [18,"God’s quiet plan was leading to you"],
      [25,"Sara my heart still stands in awe"],
      [31,"God’s grace has carried us through it all"],
      [37,"Your smile, your eyes, they calm me too"],
      [44,"God knew my best, would start with you"],
      [56,"Love Bryce and Gavin with all your heart"],
      [63,"Through faith and care our family’s grown"],
      [69,"So strong, so wise, so steady and true"],
      [75,"God’s love shines brightly through you"],
      [82,"Sara my heart still stands in awe"],
      [88,"God’s grace has carried us through it all"],
      [94,"Your smile, your eyes, they calm me too"],
      [100,"God knew my best, would start with you"],
      [113,"From Mexico waves to the oceans hue"],
      [119,"Diamondback games and laughter too"],
      [125,"Working from home, still side by side"],
      [131,"Together all these years, our hearts abide"],
      [142,"Sara my best friend, my gift, my truth"],
      [149,"The best human I ever knew"],
      [155,"Everyday I thank god anew"],
      [161,"For this life, he wrote, with you"]
    ]
  },

  whentimestoodstill: {
    title: "When Time Stood Still",
    performer: "Perry Barton",
    credit: "Written & composed by Dave Kelley • Performed by Perry Barton",
    audio: "whentimestoodstill.mp3",
    dedication: "The day life changed as she knew it.",
    lyricOffset: 0,

    /*
      TIMING:
      Replace the first 0 on each lyric line with the time, in seconds,
      when Perry begins singing that line.

      Example:
      [13.8,"We spent the whole day chasing red rock and daylight"],
      [19.6,"Sedona sun on your face, everything felt right"],

      Decimals are fine. Once EVERY line has a strictly increasing
      timestamp, the site automatically turns on highlighting/scrolling.
      Nothing else needs to be changed.
    */
    lyrics: [
      [13,"We spent the whole day chasing red rock and daylight"],
      [17,"Sedona sun on your face, everything felt right"],
      [20,"Wandering the shops, goofing off like we still do"],
      [23,"Didn't want that Saturday to end, just me and you"],
      [26,"We drove home slow with the window down"],
      [29,"Talking 'bout forever, talking 'bout now"],
      [33,"You were praying for the life we’d find"],
      [36,"Wondering if two faiths could share one bind"],

      [39,"Pulled off the highway, one more stop to go"],
      [42,"Tank running low, hearts running slow"],
      [45,"I was just a guy at the pump, unaware"],
      [48,"Heaven picked that moment to answer your prayer"],

      [52,"When time stood still"],
      [56,"Out by the road"],
      [59,"When time stood still"],
      [63,"And the whole world slowed"],
      [65,"You said yes, then you knew"],
      [67,"Love was making room"],
      [68,"When time stood still"],
      [70,"Right there with you"],

      [77,"After that trip, we kept on waiting"],
      [81,"For wedding rings and a door worth opening"],
      [84,"No moving in until the vows were done"],
      [87,"Two lives, one flame, and a race now run"],
      [90,"You hoped for a baby, a cradle, a name"],
      [93,"Life came another way, but it still changed"],
      [97,"You found those boys and loved them like home"],
      [100,"Step by step, they were never alone"],

      [102,"And I saw it plain in the way you smiled"],
      [106,"Like something broken had been reconciled"],
      [109,"You were asking God for a place to belong"],
      [113,"Then love answered back super strong"],

      [116,"When time stood still"],
      [120,"Out by the road"],
      [122,"When time stood still"],
      [126,"And the whole world slowed"],
      [128,"You said yes, then you knew"],
      [130,"Love was making room"],
      [132,"When time stood still"],
      [134,"Right there with you"],

      [148,"You tried to hide it, turned your face away"],
      [151,"But I could tell, so I asked you anyway"],
      [153,"You said the Spirit gave you your answer"],
      [156,"Right there outside of town"],
      [159,"And in that quiet little second"],
      [162,"The tears came down"],
      [166,"When time stood still"],
      [170,"And the road felt holy"],
      [172,"When time stood still"],
      [177,"You were never lonely"],
      [179,"From that gas pump prayer"],
      [181,"To the life we share"],
      [182,"When time stood still"],
      [186,"Right there with you"]
    ]
  }
};

const audio = document.getElementById("audio");
const songPicker = document.getElementById("songPicker");
const songPage = document.getElementById("songPage");
const playbar = document.getElementById("playbar");
const pageTitle = document.getElementById("pageTitle");
const pageCredit = document.getElementById("pageCredit");
const playerTitle = document.getElementById("playerTitle");
const dedication = document.getElementById("dedication");
const lyricsToggle = document.getElementById("lyricsToggle");
const lyricsBox = document.getElementById("lyrics");
const playBtn = document.getElementById("playBtn");
const progress = document.getElementById("progress");
const progressFill = document.getElementById("progressFill");
const thumb = document.getElementById("thumb");
const progressWrap = document.getElementById("progressWrap");
const currentTimeEl = document.getElementById("currentTime");
const durationEl = document.getElementById("duration");

let currentSong = null;
let isScrubbing = false;

/*
  A song is considered "timed" only when every lyric timestamp
  is strictly later than the one before it. This means the new
  song safely stays in plain-lyrics mode while its times are all 0.
*/
function hasCompleteTiming(song) {
  if (!song || song.lyrics.length < 2) return false;

  for (let i = 1; i < song.lyrics.length; i++) {
    const previous = Number(song.lyrics[i - 1][0]);
    const current = Number(song.lyrics[i][0]);

    if (!Number.isFinite(previous) ||
        !Number.isFinite(current) ||
        current <= previous) {
      return false;
    }
  }

  return true;
}

function loadSong(songKey) {
  currentSong = songs[songKey];

  audio.pause();
  audio.currentTime = 0;
  playBtn.textContent = "▶";

  audio.src = currentSong.audio;
  audio.load();

  pageTitle.textContent = `“${currentSong.title}”`;
  pageCredit.textContent = currentSong.credit;
  playerTitle.textContent = `${currentSong.title} — ${currentSong.performer}`;
  dedication.textContent = currentSong.dedication;

  lyricsBox.innerHTML = "";
  lyricsBox.scrollTop = 0;

  const timed = hasCompleteTiming(currentSong);
  lyricsBox.classList.toggle("untimed", !timed);

  currentSong.lyrics.forEach(([_, text]) => {
    const d = document.createElement("div");
    d.className = "lyrics-line";
    d.textContent = text;
    lyricsBox.appendChild(d);
  });

  lyricsToggle.style.display =
    currentSong.lyrics.length > 0 ? "inline-block" : "none";

  lyricsToggle.textContent = "Show Lyrics";
  lyricsBox.classList.remove("open");
  document.body.classList.remove("lyrics-open");

  progressFill.style.width = "0%";
  thumb.style.left = "0%";
  currentTimeEl.textContent = "0:00";
  durationEl.textContent = "0:00";

  songPicker.style.display = "none";
  songPage.style.display = "block";
  playbar.style.display = "flex";
}

function showSongPicker() {
  audio.pause();
  audio.currentTime = 0;
  playBtn.textContent = "▶";

  songPage.style.display = "none";
  playbar.style.display = "none";

  lyricsBox.classList.remove("open");
  document.body.classList.remove("lyrics-open");
  lyricsToggle.textContent = "Show Lyrics";

  songPicker.style.display = "block";
}

audio.onloadedmetadata = () => {
  durationEl.textContent = formatTime(audio.duration);
};

audio.onerror = () => {
  playBtn.textContent = "▶";
  durationEl.textContent = "—";
  console.error("Audio failed to load:", currentSong?.audio, audio.error);
};

audio.onended = () => {
  playBtn.textContent = "▶";
};

playBtn.onclick = () => {
  if (audio.paused) {
    audio.play()
      .then(() => {
        playBtn.textContent = "❚❚";
      })
      .catch(err => {
        playBtn.textContent = "▶";
        console.error("Audio playback failed:", err);
      });
  } else {
    audio.pause();
    playBtn.textContent = "▶";
  }
};

progressWrap.addEventListener("pointerdown", e => {
  isScrubbing = true;
  progressWrap.setPointerCapture(e.pointerId);
  scrub(e);
});

progressWrap.addEventListener("pointermove", e => {
  if (!isScrubbing) return;
  scrub(e);
});

progressWrap.addEventListener("pointerup", e => {
  isScrubbing = false;
  progressWrap.releasePointerCapture(e.pointerId);
});

function scrub(e) {
  if (!audio.duration) return;

  const rect = progress.getBoundingClientRect();
  const pct = Math.min(
    Math.max((e.clientX - rect.left) / rect.width, 0),
    1
  );

  audio.currentTime = pct * audio.duration;
}

audio.ontimeupdate = () => {
  if (!currentSong) return;

  currentTimeEl.textContent = formatTime(audio.currentTime);

  if (audio.duration) {
    const pct = audio.currentTime / audio.duration;
    progressFill.style.width = pct * 100 + "%";
    thumb.style.left = pct * 100 + "%";
  }

  if (!hasCompleteTiming(currentSong)) {
    return;
  }

  const t = Math.max(
    0,
    audio.currentTime - currentSong.lyricOffset
  );

  const lines = document.querySelectorAll(".lyrics-line");

  for (let i = 0; i < currentSong.lyrics.length; i++) {
    const next = currentSong.lyrics[i + 1]?.[0] ?? Infinity;

    if (
      t >= currentSong.lyrics[i][0] &&
      t < next
    ) {
      lines.forEach(l => l.classList.remove("active"));
      lines[i].classList.add("active");

      if (lyricsBox.classList.contains("open")) {
        lines[i].scrollIntoView({
          block: "center",
          behavior: "smooth"
        });
      }

      break;
    }
  }
};

function toggleLyrics() {
  lyricsBox.classList.toggle("open");
  document.body.classList.toggle("lyrics-open");

  lyricsToggle.textContent =
    lyricsBox.classList.contains("open")
      ? "Hide Lyrics"
      : "Show Lyrics";
}

function formatTime(sec) {
  if (!Number.isFinite(sec)) return "0:00";

  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60)
    .toString()
    .padStart(2, "0");

  return `${m}:${s}`;
}
</script>

</body>
</html>
